# LiteLLM Proxy 配置：内网 vllm-ascend → Langfuse（OTel callback）
# 关键点：
# - callbacks: ["otel"] 走 OTLP 上报，携带 gen_ai.server.time_to_first_token /
#   gen_ai.server.time_per_output_token（TTFT/TPOT 仅 streaming 请求上报非零值）
# - model_name 是 agent 侧请求的别名；model 的 openai/ 前缀 + api_base 指向 vllm-ascend
model_list:
  - model_name: ascend-qwen                     # agent 请求用的别名（可改）
    litellm_params:
      model: openai/Qwen2.5-72B-Instruct        # vllm serve 的实际模型名（按需修改）
      api_base: os.environ/VLLM_ASCEND_BASE_URL
      api_key: os.environ/VLLM_ASCEND_API_KEY

litellm_settings:
  callbacks: ["otel"]                           # OTel → Langfuse OTLP 端点
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY     # agent 侧用它作为 OPENAI_API_KEY
