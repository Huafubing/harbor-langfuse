# LiteLLM Proxy 配置：SiliconFlow 云端 API → Langfuse（原生 langfuse callback）
model_list:
  - model_name: deepseek-v4-flash              # agent 侧请求的别名（litellm 对外暴露）
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-V4-Flash  # 上游 SiliconFlow 的模型 ID（openai provider 前缀 + 实际名）
      api_base: os.environ/VLLM_ASCEND_BASE_URL     # = https://api.siliconflow.cn/v1
      api_key: os.environ/VLLM_ASCEND_API_KEY       # = SiliconFlow API key

litellm_settings:
  success_callback: ["langfuse"]
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
