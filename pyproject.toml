[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "atif2langfuse"
version = "0.1.0"
description = "Export Harbor ATIF trajectories and verifier scores to a self-hosted Langfuse via OpenTelemetry"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[project.scripts]
atif2langfuse = "atif2langfuse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
